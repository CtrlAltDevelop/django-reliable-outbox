[project]
name = "django-reliable-outbox"
version = "0.1.0"
description = "Transactional outbox and reliable background jobs for Django on PostgreSQL."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohammad Zarif", email = "m.zarif1996@gmail.com" }]
requires-python = ">=3.12"
keywords = ["django", "outbox", "transactional-outbox", "background-jobs", "postgresql", "queue"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = ["Django>=5.2,<6.1"]

[project.optional-dependencies]
# LISTEN/NOTIFY wake-ups use psycopg 3. Without it the worker falls back to polling.
psycopg = ["psycopg[binary]>=3.2"]
redis = ["redis>=5.0"]
kafka = ["confluent-kafka>=2.4"]

[project.urls]
Homepage = "https://github.com/CtrlAltDevelop/django-reliable-outbox"
Source = "https://github.com/CtrlAltDevelop/django-reliable-outbox"
Changelog = "https://github.com/CtrlAltDevelop/django-reliable-outbox/blob/main/CHANGELOG.md"
Issues = "https://github.com/CtrlAltDevelop/django-reliable-outbox/issues"

[dependency-groups]
dev = [
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.2",
    "types-redis>=4.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reliable_outbox"]

[tool.hatch.build.targets.sdist]
include = ["src/reliable_outbox", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.format]
# Code samples in the docs are laid out for reading (aligned comments, one call
# per line), not for the formatter.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "DJ", "PT", "S", "C4", "RET", "PL", "TID", "T20"]
ignore = [
    "PLR0913",  # keyword-only arguments are the API; counting them is not useful
    "PLR2004",  # magic values in tests and HTTP status checks read fine
    "S608",     # SQL is assembled from model metadata, never from input
    "RUF012",   # Django's class attributes (Meta, admin options) are not ClassVar-annotated
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S311", "PLR0915", "PT012"]
"bench/**" = ["S105", "S311", "S603", "T201", "PLR0915"]
"example/**" = ["S105"]
"src/reliable_outbox/migrations/**" = ["RUF", "I001", "E501"]
"tests/testapp/migrations/**" = ["RUF", "I001", "E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "bench"]
mypy_path = ["src", "."]
explicit_package_bases = true
plugins = ["mypy_django_plugin.main"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["confluent_kafka", "confluent_kafka.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: needs a reachable PostgreSQL server; skipped otherwise",
    "redis: needs a reachable Redis server; skipped otherwise",
    "slow: spawns worker processes or pushes thousands of messages",
]
filterwarnings = ["error::RuntimeWarning"]
