# Actions first: an unpinned or abandoned action is the most direct route into
# a pipeline that can execute code in your repository.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]
