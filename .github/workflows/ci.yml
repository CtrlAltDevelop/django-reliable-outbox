# Runs the tests on a pull request into main — and on nothing else.
# The job lives once in CtrlAltDevelop/ci-workflows (python-test.yml).

name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Py ${{ matrix.python }} / Django ${{ matrix.django }} / PG ${{ matrix.postgres }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.12", django: "5.2", postgres: "15" }
          - { python: "3.12", django: "6.0", postgres: "17" }
          - { python: "3.13", django: "5.2", postgres: "16" }
          - { python: "3.13", django: "6.0", postgres: "15" }
          - { python: "3.14", django: "5.2", postgres: "17" }
          - { python: "3.14", django: "6.0", postgres: "16" }
    uses: CtrlAltDevelop/ci-workflows/.github/workflows/python-test.yml@v1.2.0
    permissions:
      contents: read
    with:
      python-version: ${{ matrix.python }}
      postgres: true
      postgres-image: postgres:${{ matrix.postgres }}
      redis: true
      before-test: uv pip install "Django~=${{ matrix.django }}.0"
